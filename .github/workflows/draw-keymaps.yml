# Draw keymap diagrams for skeletyl
name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - 'boards/arm/skeletyl/*.keymap'
      - 'boards/arm/skeletyl/*.dtsi'
      - 'boards/arm/skeletyl/*.dts'
      - keymap-drawer/config.yaml
      - .github/workflows/draw-keymaps.yml

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: pipx install keymap-drawer

      - name: Parse and draw keymap
        run: |
          # Parse keymap with config
          keymap -c keymap-drawer/config.yaml parse -z boards/arm/skeletyl/skeletyl.keymap > keymap-drawer/skeletyl.yaml.tmp

          # Force known split layout template (skeletyl is not in keymap-drawer keyboard database)
          sed -i '1d' keymap-drawer/skeletyl.yaml.tmp
          cat > keymap-drawer/skeletyl.yaml << 'YAML'
          layout:
            zmk_keyboard: corneish_zen
            layout_name: foostan_corne_5col_layout
          YAML
          cat keymap-drawer/skeletyl.yaml.tmp >> keymap-drawer/skeletyl.yaml
          rm keymap-drawer/skeletyl.yaml.tmp

          # Draw SVG
          keymap -c keymap-drawer/config.yaml draw keymap-drawer/skeletyl.yaml > keymap-drawer/skeletyl.svg

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "keymap-drawer render"
          file_pattern: 'keymap-drawer/*.yaml keymap-drawer/*.svg'
