CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# dongle (nice!nano) has no physical battery in normal use - USB-C from a
# host or power bank only - but CONFIG_ZMK_BATTERY_REPORTING=n here would
# break the link: central_bas_proxy.c/central.c (pulled in by _FETCHING/
# _PROXY below) reference the zmk_peripheral_battery_state_changed event's
# raise/accessor functions, which only get generated when battery reporting
# itself is enabled - so it has to stay on even without a battery to relay
# the halves' real levels. Same reasoning as charybdis_dongle.conf.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# No LEDs on the dongle itself - this exists so &rgb_ug (BEHAVIOR_LOCALITY_
# GLOBAL) resolves locally on central and fans out to both halves over BLE.
# See the led_strip stub in skeletyl_dongle.overlay and rfcs/0001-nice-nano-dongle.md.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_SPI=y

CONFIG_ZMK_SLEEP=n
