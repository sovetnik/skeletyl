# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # --- nice!nano dongle as central (rfcs/0001-nice-nano-dongle.md) ---
  - board: nice_nano/nrf52840/zmk
    shield: skeletyl_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: skeletyl_dongle

  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset_dongle

  # --- halves, both peripherals now ---
  - board: skeletyl_left
    artifact-name: skeletyl_left

  - board: skeletyl_right
    artifact-name: skeletyl_right

  - board: skeletyl_right
    shield: settings_reset
    artifact-name: settings_reset_halves

  # --- fallback: no dongle, halves talk directly over BLE ---
  # skeletyl_left is identical in both setups (peripheral by default).
  # skeletyl_right needs to be forced central since there's no dongle to take that role.
  - board: skeletyl_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: skeletyl_right_standalone_central
